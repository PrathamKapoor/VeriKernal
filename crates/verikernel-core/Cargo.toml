[package]
name = "verikernel-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Pratham Kapoor <prathamkapoor027@gmail.com>"]
[lib]
name = "verikernel_core"
crate-type = ["rlib", "cdylib"]
[dependencies]
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-65"] }
blake3 = { version = "1", features = ["pure"] }
zeroize = "1"
verikernel-schema = { path = "../verikernel-schema" }
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
landlock = "0.4.4"
aya = "0.13"
